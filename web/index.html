<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Stork</title>
    <meta
      name="description"
      content="Keep up with your friends' babies: due dates, birthdays, star signs and the milestones in between."
    />
    <meta name="theme-color" content="#141017" />
    <meta name="color-scheme" content="dark light" />

    <!--
      Before the first paint, or a light-mode phone flashes black on every
      launch and a Hebrew one flashes the whole layout the wrong way round.
      The app sets both again properly once main.js has loaded.
    -->
    <script>
      try {
        var choice = localStorage.getItem("stork.theme");
        document.documentElement.dataset.theme =
          choice === "light" || choice === "dark"
            ? choice
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
      } catch (error) {
        document.documentElement.dataset.theme = "dark";
      }

      try {
        var lang = localStorage.getItem("stork.lang");
        if (lang !== "en" && lang !== "he") {
          var asked = navigator.languages || [navigator.language || "en"];
          lang = "en";
          for (var i = 0; i < asked.length; i++) {
            var base = String(asked[i]).toLowerCase().split("-")[0];
            if (base === "he" || base === "iw") { lang = "he"; break; }
            if (base === "en") break;
          }
        }
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
      } catch (error) {
        document.documentElement.lang = "en";
        document.documentElement.dir = "ltr";
      }
    </script>

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- iOS ignores the manifest and reads these instead. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stork" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <!-- Both languages, because the script that picks between them is the
         very thing that is not running. -->
    <noscript>
      <p style="padding: 2rem 2rem 0; text-align: center" lang="en" dir="ltr">
        Stork needs JavaScript to work out ages and countdowns.
      </p>
      <p style="padding: 0 2rem 2rem; text-align: center" lang="he" dir="rtl">
        סטורק צריך JavaScript כדי לחשב גילים וספירה לאחור.
      </p>
    </noscript>
    <script type="module" src="./main.js"></script>
  </body>
</html>
