<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Stork">
  <!-- Transparent behind, so the same mark sits on the bar in either theme.
       The PNGs in the manifest add the dark square; this one does not need it.
       Same proportions as the rasterised version in scripts/icon.mjs. -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#5f9c74" stroke-width="29" />
  <path
    d="M256 131C314 131 351 218 351 286C351 337 309 379 256 379C203 379 161 337 161 286C161 218 198 131 256 131Z"
    fill="#86c69c"
  />
  <!-- One highlight, which is all it takes to stop it reading as an oval. -->
  <ellipse
    cx="220"
    cy="215"
    rx="21"
    ry="38"
    transform="rotate(-22 220 215)"
    fill="#e8f6ec"
    opacity="0.45"
  />
</svg>
