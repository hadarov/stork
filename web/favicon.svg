<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Stork">
  <!-- Transparent behind, so the same mark sits on the bar in either theme.
       The PNGs in the manifest add the dark square; this one does not need it. -->
  <!-- Same proportions as the rasterised one in scripts/icon.mjs. -->
  <path
    d="M256 85C334 85 384 202 384 292C384 361 327 417 256 417C185 417 128 361 128 292C128 202 178 85 256 85Z"
    fill="#ffc24b"
  />
  <!-- One highlight, which is all it takes to stop it reading as an oval. -->
  <ellipse
    cx="202"
    cy="202"
    rx="28"
    ry="51"
    transform="rotate(-22 202 202)"
    fill="#fff6e0"
    opacity="0.5"
  />
</svg>
