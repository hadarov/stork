      <circle cx="287" cy="110" r="17" />
      <circle cx="256" cy="131" r="26" />
      <circle cx="256" cy="294" r="154" />
    </g>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#sky)" />
  <use href="#chick" fill="#6d4a5a" stroke="#6d4a5a" stroke-width="22" />
  <use href="#chick" fill="#fffaf6" />
  <circle cx="148" cy="330" r="30" fill="#ff8fb2" opacity="0.8" />
  <circle cx="364" cy="330" r="30" fill="#ff8fb2" opacity="0.8" />
  <circle cx="202" cy="253" r="32" fill="#4b3340" />
  <circle cx="310" cy="253" r="32" fill="#4b3340" />
  <circle cx="191" cy="242" r="12" fill="#fff" />
  <circle cx="299" cy="242" r="12" fill="#fff" />
  <path d="M256 294 L280 323 L256 352 L232 323 Z" fill="#ffa83d" />
