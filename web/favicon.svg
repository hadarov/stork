<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Stork">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdbe9" />
      <stop offset="1" stop-color="#ffaac8" />
    </linearGradient>
    <!-- Head and curl, outlined as one shape: the dark pass is drawn fattened
         and the cream pass on top covers every seam where the two meet. -->
