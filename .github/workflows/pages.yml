# Builds the app and publishes dist/ to GitHub Pages on every push to main.
#
# dist/ is not committed, so this is the only thing that ever produces the
# deployed copy. There is nothing to install: the build is plain Node.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should wait rather than race, but a superseded one is just
# an older version of the same site and can go.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Type stripping, which the build leans on, needs 22.13 or newer.
          node-version: "22.x"

      # Deploying a build whose sums do not add up would be worse than not
      # deploying, so the tests gate it.
      - run: npm run smoke

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
